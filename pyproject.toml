[project]
name = "mcsr-ranked-players-distance"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "diskcache>=5.6.3",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "pymcsrd-c",
]

[tool.uv.sources]
pymcsrd-c = { path = "pymcsrd-c" }

[dependency-groups]
dev = [
    "igraph>=1.0.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "niquests>=3.20.1",
    "pydantic>=2.13.4",
    "tqdm>=4.70.0",
]
