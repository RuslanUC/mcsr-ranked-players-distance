services:
  mcsr-ranked:
    build:
      context: .
      args:
        APP_TYPE: "mcsr-ranked"
    pull_policy: build
    command: gunicorn --preload app:app --workers 2 --bind 0.0.0.0:8080
    volumes: ['cache_data:/mcsrpd/cache-matches']
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT_RANKED}:8080"
    environment:
      - APP_TYPE=mcsr-ranked
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/health || exit 1
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
  draftout:
    build:
      context: .
      args:
        APP_TYPE: "draftout"
    pull_policy: build
    command: gunicorn --preload app:app --workers 2 --bind 0.0.0.0:8080
    volumes: [ 'cache_data:/mcsrpd/cache-matches' ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT_DRAFTOUT}:8080"
    environment:
      - APP_TYPE=draftout
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/health || exit 1
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cache_data:
    driver: local
